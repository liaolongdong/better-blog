# 首页「编辑精选」。
# 为什么不是自动热榜（2026-10-17 用真实浏览器重新实测过一遍，订正本文件早先的判断）：
# 这台 Waline Worker 的读路径是坏的——GET /api/article 对任何 path 恒返回 {"time":0}，
# 包括打开后明明显示 32 次阅读的那篇；只有 POST 自增那一侧工作正常，文章页显示的数
# 其实来自自增的响应。所以「拿不到可信的排序数据」这个结论成立，但原因不是早先写的
# 「服务端只暴露单路径读取、没有批量能力」：
#   · ?path=A&path=B 这种重复参数是通的（返回两条），逗号拼接 ?path=A,B 不通（只返回一条），
#     而 @waline/client@3.15.2 的列表页批量读用的正是逗号拼接——顺带解释了当初看到的 0；
#   · 上游确实没有任何 ORDER BY time 的全站排行接口，全站读数只能靠 admin 鉴权的 GET /api/db。
# 结论：在 Worker 的读路径修好之前，按阅读数自动精选没有可用数据源，手工挑是唯一诚实的做法。
# url 同样是 page.url 口径（不含 baseurl）。

