# 在线工具（站内计算的工具页）单一数据源 —— 设计文档 §4.2。
# 三个消费点共用这一份，不各抄一遍：顶栏「工具箱」下拉里的「免安装工具」分组（标签为什么
# 是这四个字而不是「在线工具」，见 _includes/header.html 里那条改口注释）、
# /tools.html 的同名小节、index-all.html 的页面清单。理由与 _includes/headAssets.html
# 文件头那条注释同源：同一份事实写第二遍，迟早只改一处。
#
# 为什么不并进 _data/tools.yml：那一张表里每条都带 store / screenshot / badges / post_tag
# 这些只有浏览器插件才有的字段，在线工具一个都用不上；混表的结果是那一族字段在
# 在线工具行上恒空，而消费点（下拉与产品页）已经按"必有 icon / screenshot"写了模板。
#
# 字段口径：
#   slug     permalink 的名段（/tools/<slug>.html），同时是下拉与 tools.html 小节的锚点
#   url      站内完整路径，**不带** site.baseurl，由消费点自己 prepend（同 tools.yml 的 icon 口径）
#   h1       页面正文的大标题。`title` 是给检索用的口径（见下），两者不是一件事
#   title    `<title>` / og:title / CollectionPage 的 name，按设计文档 §4.1 那三条检索口径写
#   prefix   面板 DOM 的 id 前缀。页面骨架里的 <prefix>-tablist / -tab-<slug> / -panel-<slug>
#            从这里取，`dev/js/toolIdcard.js` 交给 createPanelWorkspace 的也是那一个。
#            字面量前缀在仓库里合法的出现点只有三处：这里的 `prefix` 字段、`toolIdcard.js`
#            顶上的 CONTAINER_ID / NOTICE_ID 两个常量（那是本页自己的地址，与行为前缀是两副
#            面孔，见该文件头条 1）、骨架那四条 `data-tk-*` 属性名。除此之外一律从 data 属性
#            读——多写一处就是第二处口径，而两处不一致时红的是运行时，不是构建
#   layout   这一页的**形状**：`panels`（索引条 + 若干块互斥面板）或 `workbench`（一块工作区，
#            没有索引条）。缺省时按 `panels` 走，但缺一格且 `panels` 又是空的就判红——
#            给 `layout` 一个默认值等于在门禁里再立一处口径，`workbench` 拼错一个字母（少个 c）
#            就悄悄退回面板支，而那条路上空清单会让控件与开关那一整族判据**静默空转**，
#            红的是运行时而不是门禁。消费点只有两处读它：`scripts/check-tools-surface.mjs` 的
#            「DOM」组按它分派面板清单的来源，`tools.html` 的徽章按它决定印「N 块面板」还是「N 个动作」。
#   actions  仅 `workbench` 那一支有：工具栏动作的**枚数**，页头统计与 tools.html 徽章都印它。
#            它是 `spec.actions` 指向的那张表（`JSON_ACTIONS`）的长度，门禁⑤「DOM」逐条比两边相等——
#            这一族数字写死在 HTML 里就是「零网络请求」那一档的病：它能被一次点击证伪，却不会被构建报错。
#   features 仅 `panels` 为空的那一条有：tools.html 的 `.tool-features` 清单退成的**纯文本**要点
#            （面板那一族画的是指向页内锚点的链接，工作台式没有锚点可指，链接会是死链）。
#   spec     本页装配层那张形状表在仓库里的**位置**：`module` 是 dev/js 下的相对路径，
#            `table` 与 `ids` 是那本模块导出的两个常量名（面板清单 ↔ 每块面板的栏位与控件），
#            `actions` 是第三格、只给 `layout: workbench` 那一条用（动作清单的导出名，
#            门禁拿它的长度对上面那格 `actions`）。
#            只有 `scripts/check-tools-surface.mjs` 的「DOM」那一组消费它，模板一律不读。
#            为什么写在这里而不是写死在门禁里（段 3 §0.3）：那门禁原先无条件 import 证件页的
#            `WORKBENCH_SPEC` / `PANEL_IDS`，却拿它去比每一条 ready 条目——第二条 ready 条目
#            一登记就必红，且红在它压根没犯的错上。指针是事实的一部分，跟着条目走；
#            表的内容仍然只活在那本模块里，这里不抄第二遍
#   panels   面板清单，顺序 = 索引条顺序 = 禁用脚本时的文档顺序；`slug` 就是页内 #hash 锚点
#            （`layout: workbench` 那一条按设计就是**空**：这一页没有索引条，清单只活在装配层那张表里）
#     desc   面板正文说明（页内静态文案，禁用脚本也读得到）
#   status   该页的实现状态：只有 ready 的那几条会被消费点画成链接。段 2 的清单里只有 idcard
#            这一条，段 3 / 段 4 交付时各自**追加**自己那一条（不是来改这一条的 status）；
#            planned 这一档现在没有条目在用，留着是因为"先进清单、后补正文"正是这条流水线
#            最容易卡住人的地方——挡在数据层，不靠改模板
- slug: idcard
  url: /tools/idcard.html
  name: 证件与机构代码工具
  tagline: 身份证 / 统一社会信用代码 / 银行卡 / 手机号 / 随机测试数据
  title: 身份证号校验与生成 · 统一社会信用代码
  h1: 证件与机构代码工具
  icon: /assets/img/tools/idcard-tool.svg
  status: ready
  prefix: tk
  layout: panels
  spec:
    module: dev/js/tools/workbench.js
    table: WORKBENCH_SPEC
    ids: PANEL_IDS
  desc: >-
    五块面板都在浏览器本地算：粘贴号码做校验与逐段解析，或按区划、性别、年龄段随机合成测试数据。
    行别与号段按内置的第三方快照给出，只作参考、不承诺全量。
  panels:
    - slug: idcard
      name: 身份证
      tagline: 18 位校验与解析、15 位第一代写法、按区划合成
      desc: >-
        粘一行或一个文件的多行号码，逐行给三态结论（有效 / 校验位不符 / 结构非法）、逐项判定表和全量解析：
        省市区三级码与全名、出生日期与周岁、性别、顺序码、校验位的算式。
        出生年在 1900–1999 内的 18 位号会同时给出等价的 15 位写法。
        区划码查不到时不下"无效"结论，只说明它未见于现行区划表。
    - slug: uscc
      name: 统一社会信用代码
      tagline: 18 位解析、字符集与两层校验位、按区划合成
      desc: >-
        校验第 1–17 位的字符集与两套权重算式，并把 18 位拆开：登记管理部门与机构类别（只给字符，
        取值含义表没取到可核实来源，本站不猜名称）、行政区划、主体标识、内层组织机构代码校验位、
        本层校验位。生成侧第 9–17 位用真实结构（8 位本体加 GB/T 11714 校验位）。
        字符 I、O、S、Z、V 不属 31 字符集，出现即判结构非法。
    - slug: bankcard
      name: 银行卡
      tagline: Luhn 校验与逐位算式、行别前缀参考、按行别合成
      desc: >-
        校验按 Luhn 与 13–19 位长度给结论，并列出逐位相加的算式；行别与登记位数查内置前缀表，
        查不到只说"表内未收录"，不下"无效"结论。生成侧从表内的 BIN 出发，补随机体与 Luhn 校验位，
        所以每一条都能被本页的校验判成有效。
    - slug: mobile
      name: 手机号
      tagline: 11 位格式判定、三位号段判运营商、按运营商合成
      desc: >-
        格式（11 位、1[3-9] 开头）是硬结论；运营商按三位号段判定，是发号口径的参考，
        携号转网后不代表当前实际运营商。本站不做号码归属地：三位号段这一层判不到城市，
        而能干净取到许可的公开来源也只有这一层。
    - slug: random
      name: 随机测试数据
      tagline: 姓名 / 地址 / 邮箱，单类或一次一组
      desc: >-
        姓名由本站自造的常用姓氏与名字用字随机组合，地址由现行区划全名加通用街道词与门牌拼出，
        邮箱一律落在 RFC 2606 的 example 保留域。三类都不指向任何真实个人或真实信箱，
        只做开发与测试用途的占位数据。
- slug: codec
  url: /tools/codec.html
  name: 编码与摘要工具
  tagline: 时间戳 / Base64 / URL 编码 / 摘要 / 正则
  title: 时间戳转换 · Base64 编解码 · MD5 摘要
  h1: 编码与摘要工具
  icon: /assets/img/tools/codec-tool.svg
  status: ready
  prefix: tk
  layout: panels
  spec:
    module: dev/js/tools/codecWorkbench.js
    table: CODEC_SPEC
    ids: CODEC_PANEL_IDS
  desc: >-
    五块面板都在浏览器本地算：粘时间戳或日期做换算与求差，文本与 Base64、URL 百分号编码互转，
    给一段文本或一个本地文件算 MD5 与 SHA 家族，或拿正则试匹配与替换预览。超限的输入整体拒绝并说明差多少，
    不截断悄悄算。
  panels:
    - slug: timestamp
      name: 时间戳
      tagline: 秒与毫秒 ⇄ 日期、时区偏移、两个时刻求差
      desc: >-
        10 位按秒、13 位按毫秒；其余长度不下"无效"结论，而是把按秒与按毫秒两种解释一起给。
        也收 2026-09-28 09:00 这类民用写法，串里没写时区就按偏移那一格算，留空则按本机时区。
        结果含 UTC 与本地两种表示、ISO 8601、RFC 3339 与相对时间；求差那栏取绝对值，给总秒数与几天几小时的拆法。
    - slug: base64
      name: Base64
      tagline: 文本 ⇄ Base64、data URI，两种解码严格度
      desc: >-
        按 UTF-8 算字节，四字节 emoji 正常往返，落单的代理项（半个 emoji）会被点名是哪一位。
        解码分宽容与严格两档：宽容档忽略空白与换行，严格档连字符集与长度一起判。
        data URI 那一档给 MIME 与是否 base64 编码，解析失败只说明缺了哪一段。
    - slug: url
      name: URL 编码
      tagline: 整串与单值两种百分号编码、查询参数拆解
      desc: >-
        同一段输入同时给 encodeURIComponent 与 encodeURI 两种结果，两者不等时列出差在第几位；
        带问号的串再拆成参数表。空格写成 %20 还是加号、十六进制大小写这些分歧各写一行，
        不替某个浏览器下结论——百分号编码没有唯一正确答案，只有"按哪条规则"。
    - slug: digest
      name: 摘要
      tagline: MD5 与 SHA-1/256/384/512，文本或本地文件
      desc: >-
        MD5 是本站自实现，SHA 四档走浏览器的 Web Crypto。非安全上下文（http 站点与 file://）
        拿不到 Web Crypto，那四格会标成"环境不支持"而不是留空。文本上限 1 MiB、文件上限 5 MiB，
        字节在浏览器里读完就算，不上传、不留存。MD5 只该用于校验传输完整，不该当密码存。
    - slug: regex
      name: 正则
      tagline: 匹配与捕获组、替换预览、防回溯的耗时闸门
      desc: >-
        表达式最长 500 字符，先过静态风险检查（嵌套量词这类可回溯的形状会点名拦下），
        匹配另设 1000 条与 50 毫秒两道闸门，被哪一道拦住就写哪一道——这三道都是为了不让一个
        粘贴把整页跑挂。捕获组给位置组与命名组两张表，替换串只出预览结果，不写回任何地方。
# ── 段 4：JSON 工作台页。这一条与前两条有三处形状不同，都不是笔误：
#   ① `prefix: jt`——前两页是 `tk`，这一页第一次让 id 前缀与类名前缀同串（§W 的换前缀自证那条判据
#      量的就是它：改这一格，整页 id 与四条 `data-jt-*` 的值跟着换，门禁仍绿）；
#   ② `layout: workbench` + `panels: []`——这一页没有索引条，控件清单只有装配层那一张表
#      （`JSON_SPEC.workbench.sides.main`），yml 再列一遍就是第二处口径；
#   ③ `actions` / `spec.actions`——工具栏动作的枚数由模块那张表报数，页头统计与 tools.html 徽章
#      印的是它，门禁「DOM」逐条比两边相等。写死一个数字进 HTML 就是「零网络请求」那一档的病：
#      它能被一次点击证伪，却不会被构建报错（2026-09-29 那次改口的教训记在 tools.html 的徽章注释里）。
- slug: json
  url: /tools/json.html
  name: JSON 格式与转换工具
  tagline: 格式化 / 校验 / 树视图 / 转 TS · YAML · XML · CSV
  title: JSON 在线格式化与校验 · 转 YAML/XML/CSV
  h1: JSON 格式与转换工具
  icon: /assets/img/tools/json-tool.svg
  status: ready
  prefix: jt
  layout: workbench
  actions: 14
  spec:
    module: dev/js/tools/jsonWorkbench.js
    table: JSON_SPEC
    ids: JSON_PANEL_IDS
    actions: JSON_ACTIONS
  desc: >-
    一块工作台，左边粘贴框带行号，右边出结果，视图在「文本 / 树」之间切。工具栏那一批动作里含格式化、
    压缩、键排序、转义与反转义、复制下载，以及与 TypeScript、YAML、XML、CSV 的互转。坏输入给得出精确行列号，
    并把那一处在输入区选中；超限整体拒绝并说明超了多少，不截断悄悄算。
  features:
    - 格式化 / 压缩 / 键排序，缩进两格、四格、制表符三档
    - 校验给精确行列号，那一段同时在输入区选中，坏输入也照常给出字节与行数读数
    - 树视图可折叠展开、按键与值搜索、点一下复制那一格的 JSON Pointer，只渲染看得见的行
    - 与 TypeScript 接口、YAML、XML、CSV 互转，转回来也走同一块粘贴框
    - 输入只在本地解析：不发请求、不上传，默认不写 localStorage，勾了「记住上次输入」才写本机
  panels: []
