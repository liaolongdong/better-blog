<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <!-- 静态页不走 Liquid，图标只能用相对路径（其余页面用 site.baseurl） -->
    <link rel="icon" href="../../favicon.ico" type="image/x-icon">
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
    <title>hash router</title>
    <meta name="robots" content="noindex, nofollow">
</head>

<body>
    <h1 id="app"></h1>
    <a href="#/home">home</a>
    <a href="#/about">about</a>
    <script>
        // 解决刷新页面bug
        // 用 textContent 而不是 innerHTML：这里写的值是 URL 片段，属于「外人可控的输入」。
        // Chromium 会把片段里的 `<` 归一化成 %3C，所以今天它并不可利用（2026-11-02 实测：
        // goto 与页内点击两条路都不落地标签）——但把 URL 直接喂给 innerHTML 是一枚等别人
        // 换浏览器/换注入路径才响的雷，而演示的显示效果两种写法一模一样。
        location.hash && (app.textContent = location.hash.slice(2));
        window.addEventListener('hashchange', () => {
            app.textContent = location.hash.slice(2)
        })
    </script>
</body>

</html>
