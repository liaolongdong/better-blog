<!-- Waline 评论系统 - 评论 + 阅读量 + 点赞一体化 -->
<!-- 文档: https://waline.js.org/ -->
{% if site.waline.enable %}
<section class="post-footer-item comment">
    <div id="waline"></div>
</section>
<style>
    #waline {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
    }
    /* 评论区域与博客风格适配 */
    .post-footer-item.comment {
        padding: 0;
    }
</style>
<script type="module">
    import { init } from 'https://unpkg.com/@waline/client@v3/dist/waline.js';

    // 基础配置（不含 pageview，便于提交后重载时避免阅读量被重复自增）
    const walineConfig = {
        el: '#waline',
        serverURL: '{{ site.waline.serverURL }}',
        lang: '{{ site.waline.lang | default: "zh-CN" }}',
        // 表情预设：显式走 https + jsdelivr，与上面 reaction 图标同源。
        // 默认的 //unpkg.com/@waline/emojis@1.1.0/weibo 是协议相对地址，
        // 在 http 页面会先 307 跳转到 https，且 unpkg 国内访问不稳定。
        emoji: ['https://cdn.jsdelivr.net/npm/@waline/emojis@1.2.0/weibo'],
        {% if site.waline.reaction %}
        // 文章反应：点赞 + 收藏
        reaction: {{ site.waline.reaction | jsonify }},
        locale: {
            reactionTitle: '觉得这篇文章怎么样？',
            reaction0: '点赞',
            reaction1: '收藏',
        },
        {% endif %}
        // 访客配置
        login: 'enable',
        // 记录路径与列表页 data-path 保持一致（含 baseurl），保证阅读量可正确回显
        path: '{{ site.baseurl }}{{ page.url }}',
    };
    const walinePageview = {% if site.waline.pageview %}true{% else %}false{% endif %};

    let walineInstance = init({ ...walineConfig, pageview: walinePageview });

    // 自定义 Waline 后端在评论提交成功后，客户端既不会乐观插入、也不会重新拉取列表，
    // 导致新评论必须手动刷新整页才可见。此处在检测到提交成功后主动重载评论区：
    // destroy 后以 pageview:false 重新 init —— 等效刷新评论列表，但不刷新整页、
    // 不重复自增阅读量（头部 .waline-pageview-count 在 #waline 之外，其值予以保留）。
    let walineReloading = false;
    function reloadWalineComments() {
        if (walineReloading) return;
        walineReloading = true;
        window.setTimeout(() => {
            try {
                if (walineInstance && typeof walineInstance.destroy === 'function') {
                    walineInstance.destroy();
                }
                walineInstance = init({ ...walineConfig, pageview: false });
            } catch (err) {
                // 重载失败时静默降级：评论已保存，用户仍可手动刷新查看
            } finally {
                walineReloading = false;
            }
        }, 400);
    }

    // 拦截 fetch，捕获 POST /api/comment 的成功响应后重载评论列表。
    // 仅在“新建评论/回复”成功时触发（响应含完整评论对象），异常绝不影响正常请求。
    const originalFetch = window.fetch;
    window.fetch = function (...args) {
        const request = originalFetch.apply(this, args);
        try {
            const target = args[0];
            const url = typeof target === 'string' ? target : (target && target.url) || '';
            const method = ((args[1] && args[1].method) || (target && target.method) || 'GET').toUpperCase();
            if (method === 'POST' && /\/api\/comment(?:\?|$)/.test(url)) {
                request.then((response) => {
                    if (!response || !response.ok) return;
                    response.clone().json().then((body) => {
                        if (body && body.errno === 0 && body.data && body.data.objectId && body.data.comment) {
                            reloadWalineComments();
                        }
                    }).catch(() => {});
                }).catch(() => {});
            }
        } catch (err) {
            // 拦截逻辑异常时忽略，保证原始请求正常返回
        }
        return request;
    };

    // 后端渲染 markdown 时把整段评论做了 HTML 转义，表情面板插入的
    // <img class="wl-emoji"> 因此变成纯文本；同时 URL 里的 "_" 被当成斜体语法
    // 解析成 <em>（weibo_smile -> weibo<em>smile）。这里在渲染后按白名单还原。
    const ESCAPED_EMOJI_RE = /&lt;img\s+class=(?:"|&quot;)wl-emoji(?:"|&quot;)\s+src=(?:"|&quot;)([^"&]*)(?:"|&quot;)(?:\s+alt=(?:"|&quot;)([^"&]*)(?:"|&quot;))?\s*\/?&gt;/g;
    const EMOJI_CDN_RE = /^(?:https?:)?\/\/(?:unpkg\.com|(?:cdn|fastly)\.jsdelivr\.net|npm\.elemecdn\.com)\/@waline\/emojis@[\w.-]+\/[\w-]+\/[\w.-]+\.(?:png|gif|jpe?g|webp)$/;
    const restoredContent = new WeakMap();

    function restoreWalineEmojis() {
        const root = document.getElementById('waline');
        if (!root) return;
        root.querySelectorAll('.wl-content').forEach((el) => {
            const html = el.innerHTML;
            // 已处理过同一段内容则跳过，避免自身写回再次触发观察者
            if (restoredContent.get(el) === html) return;
            if (!html.includes('&lt;img')) {
                restoredContent.set(el, html);
                return;
            }
            let restored = false;
            const next = html.replace(ESCAPED_EMOJI_RE, (matched, src, alt) => {
                // <em> 是被 markdown 吃掉的 "_"，还原后才是合法文件名
                const url = src.replace(/<\/?em>/g, '_');
                if (!EMOJI_CDN_RE.test(url)) return matched;
                restored = true;
                const safeAlt = (alt || '').replace(/<\/?em>/g, '_').replace(/[<>"'&]/g, '');
                const safeSrc = url.startsWith('//') ? 'https:' + url : url;
                return '<img class="wl-emoji" src="' + safeSrc + '" alt="' + safeAlt + '" loading="lazy">';
            });
            restoredContent.set(el, next);
            if (restored) el.innerHTML = next;
        });
    }

    const walineRoot = document.getElementById('waline');
    if (walineRoot) {
        new MutationObserver(restoreWalineEmojis).observe(walineRoot, { childList: true, subtree: true });
        restoreWalineEmojis();
    }
</script>
{% endif %}
