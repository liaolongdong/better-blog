<style media="screen">
    .reward {
        padding: 5px 0;
        margin: 20px auto;
        width: 90%;
        text-align: center;
    }
  
    .rewardButton {
        /* #f44236 上的白字只有 3.70:1（18px 常规字重要求 4.5），压深到 #d93025 是 4.77。
           悬停档原先是变浅的 #F7877F —— 白字掉到 2.41:1，正是「按下去才看不清」的那类
           反直觉反馈，改成同色系变深 #b3261e（6.54:1），悬停读作「更实」而不是「更淡」。 */
        background-color: #d93025;
        -moz-border-radius: 8px;
        -webkit-border-radius: 8px;
        border-radius: 8px;
        display: inline-block;
        cursor: pointer;
        color: #ffffff;
        font-family: '微软雅黑';
        font-size: 18px;
        padding: 5px 25px;
        text-decoration: none;
    }
  
    .rewardButton:hover {
        background-color: #b3261e;
    }
  
    /* 这里原有两条 .wechat:hover p / .alipay:hover p 的 animation: roll .1s infinite，
       但全站（26 个 @keyframes）没有叫 roll 的那一个，两条都是空转的死引用。
       上游主题里的 roll 是每秒 10 次、每次 1deg 的抖动，从没在这座站上出现过，
       补一个回来等于新增一个谁也没见过的抖动画——所以按死代码删掉。 */
  
    .QR {
        padding-top: 20px;
    }
  
    .QR a {
        border: 0;
    }
  
    .QR img {
        width: 180px;
        max-width: 100%;
        display: inline-block;
        margin: 0.8em 2em 0 2em;
    }
  </style>

<div class="reward">
    <a class="rewardButton" title="请{{ site.author }}喝杯咖啡？">赞 赏</a>

    <div class="QR" style="display: none;">
        {% if site.reward.reward_comment %}
        <div>
            <span style="font-family: '微软雅黑'; font-size: 18px; ">{{ site.reward.reward_comment }}</span>
        </div>
        {% endif %}

        {% if site.reward.wechatpay %}
        <div class="wechat" style="display: inline-block">
            <img class="wechat_qr" src="{{ site.reward.wechatpay | prepend: site.baseurl }}" title="用微信请{{ site.author }}喝杯咖啡？" alt="用微信请{{ site.author }}喝杯咖啡？" />
            <p>微信支付</p>
        </div>
        {% endif %}

        {% if site.reward.alipay %}
        <div class="alipay" style="display: inline-block">
            <img class="alipay_qr" src="{{ site.reward.alipay | prepend: site.baseurl }}" title="用支付宝请{{ site.author }}喝杯咖啡？" alt="用支付宝请{{ site.author }}喝杯咖啡？" />
            <p>支付宝</p>
        </div>
        {% endif %}
    </div>
</div>

<script type="text/javascript">
    $(document).ready(function () {
        $("a.rewardButton").click(function () {
            $("div.QR").slideToggle()
        });
    });
</script>
