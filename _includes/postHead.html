<head>
    <meta name="base-url" content="{{ site.baseurl }}">
    <script>window.SITE_BASEURL = "{{ site.baseurl }}";</script>
    <!-- 位置勿动：必须排在下方所有 <link rel=stylesheet> 之前，约束见 themeBootstrap.html 文件头 -->
    {% include themeBootstrap.html %}
    <link rel="icon" href="{{ site.baseurl }}/favicon.ico" type="image/x-icon">
    <link rel="icon" href="{{ site.baseurl }}/favicon.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="{{ site.baseurl }}/favicon.ico" type="image/x-icon">
    {% include seoMeta.html %}
    {% include headAssets.html %}
    <!-- 只在文章页加载：站内唯一用到 fa 类的是 anchor.html 给标题锚点设的 fa-anchor -->
    <link rel="stylesheet" href="https://cdn.bootcss.com/font-awesome/4.7.0/css/font-awesome.min.css">
    {% include seoScript.html %}
    
	{% if site.mathjax %}
	{% include mathjax.html %}
	{% endif %}
    {% include anchor.html %}
    {% if site.waline.enable %}
    <link rel="stylesheet" href="https://unpkg.com/@waline/client@v3/dist/waline.css" />
    {% endif %}
    {% include cloudflareAnalytics.html %}
</head>
