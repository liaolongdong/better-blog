# Build settings
# 首页信息流改为横向缩略图卡片后，单屏可见篇数提高，每页 8 篇足够填满首屏并减少翻页。
paginate: 8
paginate_path: 'page:num'
# 不参与站点构建的文件/目录（Jekyll 会与内置默认排除项合并，Gemfile、vendor/bundle 等无需重复列出）。
# 这里列的都是仅开发/部署用的资产，一旦漏排就会被拷进 _site 并公开可访问。
exclude:
  - node_modules
  - dev
  - dist
  - .vite
  # 旧 @vitejs/plugin-legacy 的输出残留：该插件已从依赖中移除，全站零引用
  - vite-dist
  - package.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - vite.config.js
  - vite.demo.config.js
  - postcss.config.js
  - .gitignore
  - .npmrc
  - .node-version
  # 开发与部署文档/脚本，不属于站点内容
  - README.md
  - USAGE.md
  # 版本记录与许可文本：给仓库读者看，不是站点页面。不带 front matter 的 .md 也会被
  # 原样复制进 _site（Jekyll 只把「有 front matter 的 md」当页面渲染），所以必须显式排除；
  # LICENSE 同理，否则线上多一个 /LICENSE 静态文件。
  - CHANGELOG.md
  - LICENSE
  - LICENSE-CONTENT.md
  - OPTIMIZATION_COMPLETE.md
  - deploy-ali.sh
  - deploy-github.sh
  # 本地临时试验页（内容只有 console.log），全站零引用，不应出现在线上。
  # 注意 exclude 按源目录相对路径匹配，这一条只排得掉根目录的 test.html；
  # demo/*/test.html 那 6 个嵌套同名文件排不掉（构建产物里实测仍在），
  # 它们又是 demo 页的调试入口不便删除，所以改用页面内的 noindex meta 处理。
  - test.html
  # 与 feed.xml 内容等价的第二份全文订阅源：站内零引用（<link rel=alternate> 指向的是
  # feed.xml），却同样公开可访问。两份全文源等于给爬虫两套重复语料，
  # 且它的 atom:link self 反指 /feed.xml，口径自相矛盾。留源不发。
  - rss.xml
  # 出图工具的中间产物目录：无 _ 或 . 前缀，不加 exclude 会被原样复制进 _site 并公开服务。
  # 里面的 PNG 会被搬进 assets/img/{slug}/ 转成 webp，原件不属于站点内容
  - vibe_images
  # 文章配图的工作笔记：assets/img/{slug}/prompts/*.md（出图 prompt）与
  # assets/img/{slug}/outline.md（配图大纲）。它们带 YAML front matter，会被 Jekyll
  # 当成页面渲染成 /assets/img/.../xxx.html 并公开——修之前线上有 44 个这样的英文笔记
  # （42 份 prompts + 2 份 outline，逐个核对过首行都是 ---，全部会被渲染），
  # 与博客主题无关、内容又薄，正是拉低全站质量评分的那类低价值页。
  # 用 exclude 而不是删文件：这些是重新生成配图的依据，要留在仓库里。
  - "assets/**/*.md"
  # iconfont.cn 下载包里自带的字形预览页，全站零引用，却在线上 200 可访问：
  # 一个只有图标 class 列表的第三方页面挂在域名下，属于纯粹的收录噪音。
  - assets/iconFont/demo_index.html

# Markdown
markdown: kramdown
highlighter: rouge
kramdown:
