# Site settings 配置站点
#
# title 与 seo_title 是两个口径，不要合并：
#   title     —— 品牌名，出现在导航刊头（_includes/header.html 里目前是硬编码的同一串字）、
#                og:site_name、feed/sitemap 的站点名。改它等于改站点的对外署名。
#   seo_title —— 只进 <title> 与 og:title，是搜索结果里那一行蓝链的标题。
# 品牌名「Better’s study fairyland」不含任何检索词，中文读者搜「前端博客」「npm」
# 「React」时它一个都命不中，却占着每个页面 <title> 后缀的位置。
# 所以后缀换成「Better 前端博客」：保住 Better 这个检索实体，同时把「前端博客」这个
# 真正有人在搜的词放进每个页面的标题里。
title: 'Better’s study fairyland'
seo_title: 'Better 前端博客'
# 首页没有 page.title（刊头用的是 home-title），所以 <title> 单独给一条：
# 检索实体「廖龙东」+ 品牌「Better」+ 类目词「前端博客 / AI 工具实测」一次带到。
seo_home_title: '廖龙东（Better）的前端与 AI 技术博客 · npm 与 AI Agent 实测'
# 信息流分页页（/page2/ …）专用的短标题前缀。不能用上面那条：它已经 59 显示列，
# 再往后拼页码就会被 SERP 从右边截掉，页码等于没写。这条留 36 列，够放「· 第 N/M 页」。
seo_archive_title: '廖龙东（Better）的前端与 AI 技术博客'
# 全站兜底描述（无 page.seo_description / description / subtitle 时才用）。控制在 158
# 显示字符内，中文按全宽计——超出的部分搜索引擎直接省略号截断。
# 口径注意：这里不写「每篇都实测过」这类全站级断言，2016–2024 那批文章里有工作总结、
# 学习资料与踩坑记录，并不都成立；「开源项目实测多附可复现命令」才是能被文章对上的说法。
description: '廖龙东（网名 Better，写作廖小新）的前端与 AI 博客：React、Vue、Node.js、npm、Chrome 插件与 AI Agent 工具链的长期记录，开源实测多附可复现命令，自 2016 年更新。'
# 逗号一律用半角：旧值里的全角「，」把 canvas 和 Python 粘成了一个检索词。
keyword: '廖龙东,廖小新,廖龙东博客,廖龙东前端,Better,Better前端博客,前端开发,web前端,React,Vue,Node.js,npm,Chrome插件,微信小程序,AI Agent,前端开源项目实测'
url: 'https://liaolongdong.github.io' # your host
# url: 'https://liaolongdong.com' # your host

# Project site: repo is 'better-blog', so GitHub Pages serves it at
# https://liaolongdong.github.io/better-blog/ — baseurl must be '/better-blog'.
# (CI's actions/configure-pages injects the same base_path at build time.)
baseurl: '/better-blog'

# 站点版本号。唯一的口径是 git tag：tag 打在 master 上（Pages 的 Workflow 只监听 master），
# 与线上产物同源，所以这里的值必须等于 master 上最新的 tag。
# 三处要一起改：本字段、package.json 的 version、CHANGELOG.md 的新条目——
# 递增规则与发版步骤见 USAGE.md「版本号与 tag 约定」。
# 页脚读它（_includes/footer.html），置空则页脚不显示版本，不影响任何页面。
version: '2.0.1'

# github baseUrl
githubUrl: 'https://github.com/liaolongdong'

# Navigation links
# 列表形式而非哈希：Jekyll 对哈希的迭代顺序不保证，导航条必须按人眼预期的顺序渲染。
# dropdown: tools 表示该项渲染为「工具箱」下拉菜单，子项取自 _data/tools.yml。
nav:
  - key: home
    label: 首页
    url: '/'
  - key: tools
    label: 工具箱
    url: '/tools.html'
    dropdown: tools
  - key: categories
    label: 分类
    url: '/categories.html'
  - key: series
    label: 合集
    url: '/series.html'
  - key: tags
    label: 标签
    url: '/tags.html'
  - key: demo
    label: 示例
    url: '/demo.html'
  - key: weblab
    label: 编辑器
    url: '/weblab.html'
  - key: about
    label: 关于
    url: '/about.html'

# Author 配置博主信息
author: 'Better'
nickname: 'Better'
bio: '一枚喜欢研究心理学的前端er'
avatar: '/assets/img/profile.png'
# 检索实体的名字口径，只给 JSON-LD 与 llms.txt 用，页面可见文案一律不读这两个字段。
# author 是「署名」：文章页作者行、打赏提示、meta name=author 都在用它，改它会改到看得见的字。
# author_name 是 Person 的 name。不取署名而取中文名，是因为 about.html 才是 Person.@id
# 指向的那一页，它的 H1 是本名——而 Better / 廖龙东 / 小新 三种写法站内都出现过，
# 把它们与正名一起收进 alternateName，搜索引擎才会解析成同一个实体，
# 而不是各建一份知识面板。新增别名只改这一行，三处声明自动跟上。
author_name: '廖小新'
author_alt_name: ['Better', '廖龙东', '小新']

# Social / Open Graph 默认值
# 分享卡片用的站点级默认图：微信、微博、X、Telegram 抓 og:image 时，文章若没写
# cover 就回落到这张。1200×630 是 OG 的推荐比例（Twitter 大卡在 2:1 时不被裁切）。
social:
  og_default_image: '/assets/img/social-default.jpg'
  # X/Twitter 卡片类型：summary_large_image 才会渲染 2:1 大图
  twitter_card: 'summary_large_image'
  twitter_site: ''   # 没有 X 站点账号就留空，会跳过 twitter:site
  # 中文站固定 zh_CN；留空会让部分平台按抓取语言猜，简繁混排时卡片文案会跳
  og_locale: 'zh_CN'

